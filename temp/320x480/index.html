<!DOCTYPE html>
<html lang="en">
  <head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="x-rm-alias" content="tracker_DA-AU-CTR">
    <title></title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="js/gsap.min.js"></script>
    <script type="text/javascript" src="js/eskimi_rm.min.js"></script>

    <style id="resize-styles">
    :root {
      --bnr-width: 320px;
      --bnr-height: 480px;
      --btn-height: 32px;
      --bg-img: url("../assets/bg.jpg");

    }
  </style>
  
  </head>

  <body class="inner-page">
    <div class="wrapper">
      <div class="bg"></div>
      <div class="bg2 abs adsize">
        <div class="btn abs noevent"></div>
        <img src="assets/frame3.svg" alt="" class="abs adsize">
      </div>
      <div class="frame2 abs adsize">
        <div class="form_holder abs">
          <div class="form_name">
            <div class="form_name_conteiner">
              سجل إهتمامك الآن
            </div>
          </div>
          <div class="formGroup">
            <div>
              <input type="text" id="your_name" class="input_field your_name" placeholder="الإسم الكامل">
            </div>
          </div>
          <div class="formGroup">
            <div>
              <input type="text" id="your_phone" class="input_field your_phone" placeholder="رقم الجوال" onkeypress="return onlyNumberKey(event)">
            </div>
          </div>
          <div class="formGroup">
            <div>
              <input type="text" id="your_city" class="input_field your_city" placeholder="المدينة">
            </div>
          </div>
          <div class="btn_wrap">
            <img src="assets/try_again_btn.svg" alt="" class="try_again_btn">

            <img src="assets/submit_btn.svg" alt="" class="submit_btn" id="submit_btn">
          </div>

          <div class="error_messages noevent opacity0">
            <p class="error hide" id="error_text">*Your name</p>
            <p class="error hide" id="error_email">*Your email</p>
            <p class="error hide" id="error_phone">*Your phone number</p>
            <p class="error hide" id="error_location">
              *Please enter your location
            </p>
            <p class="error hide" id="error_psc">*Your city</p>
          </div>
        </div>
      </div>

      <div class="frame1 abs adsize">
        <div class="icon"></div>
        
      </div>
    </div>
    <script type="text/javascript">

      // =========================================================== // Eskimi Def
      var ticket_id = "86c7rbuk5"; // Replace this with the main ClickUp ticket ID (not the subtask ID)

      var assets_url = "assets/";

      var campaign_id = "{CAMPAIGN_ID}";
      var creative_set_title = "{CREATIVE_SET_TITLE}";
      var site_title = "{SITE_TITLE}";
      var site_id = "{SITE_ID}";
      var creative_set_id = "{CREATIVE_SET_ID}";

      var tracker_id = document.querySelector(
        'meta[name="x-rm-alias"]'
      )?.content;
      //var submitUrl = `https://api.eskimi-creatives.com/usage_tracker/tracker.php?ticketid=${ticket_id}&campid=${campaign_id}&cset_id=${creative_set_id}&cset_title=${creative_set_title}&stitle=${site_title}&site_id=${site_id}`;
      var submitUrl = '';

      var ismain = false;
      var isseen = false;

      const wrapper = document.querySelector(".wrapper");
      gsap.set(wrapper, { opacity: 0 });

      var clickTag = "{CLICK_URL}";
      var eventUrl = "{EVENT_URL}";
      var videoEventUrl = "{VIDEO_EVENT_URL}";

      function startEvent(event) {
        var track = new Image();
        track.src = eventUrl + event;
      }

      var isStarted = true;
      function startedFunction() {
        if (isStarted) {
          isStarted = false;
          startEvent("Main");
        }
      }

      var isFinished = true;
      function finishedFunction() {
        if (isFinished) {
          isFinished = false;
          startEvent("Seen_All");
        }
      }

      function clickThrough(event) {
        window.open(clickTag);
      }

      var engOb = {
        mouseOver: false,
        touch: false,
      };

      function setEng(event) {
        if (!engOb.mouseOver && !engOb.touch) {
          switch (event.type) {
            case "mouseover":
              engOb.mouseOver = true;
              startEvent("Mouse_Over");
              break;
            case "touchstart":
              engOb.touch = true;
              startEvent("Touch");
              break;
          }
        }
      }

      wrapper.addEventListener("mouseover", setEng);
      wrapper.addEventListener("touchstart", setEng);

      const initTracker = document.querySelector(
        'meta[name="x-rm-alias"]'
      )?.content;
      startEvent(initTracker);


      function trackValues(val1, val2, val3, val4, val5) {
        tracker = new Image();
        tracker.src =
          "https://rm.eskimi.com/dsptools/api/tracker?site_id=" +
          "{site_id}" +
          "&cid=" +
          "{campaign_id}" +
          "&crid=" +
          "{creative_id}" +
          "&value1=" +
          val1 +
          "&value2=" +
          val2 +
          "&value3=" +
          val3 +
          "&value4=" +
          val4 +
          "&value5=" +
          val5;
      }
    </script>
    <script type="text/javascript" src="js/code.js"></script>
  </body>
</html>
